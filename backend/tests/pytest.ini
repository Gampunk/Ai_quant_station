[pytest]
asyncio_mode = auto
testpaths = tests
timeout = 600
timeout_method = thread
filterwarnings =
    ignore::DeprecationWarning
markers =
    order1: test order
    order2: test order
    order3: test order
    order4: test order
    order5: test order
    order6: test order
    order7: test order
    requires_ai_key: needs a real AI provider API key
    requires_parquet: needs the local parquet price archive
