# Starts Postgres, the backend and nginx. Only nginx is reachable from outside.
#
#   1. Put POSTGRES_PASSWORD=<letters and digits> in a file named .env next to
#      this one (git ignores it). Compose refuses to start without it.
#   2. backend/.env needs SECRET_KEY and DEFAULT_ADMIN_PASSWORD, as for local runs.
#   3. docker compose up --build, then open http://localhost:8080
#
# No HTTPS yet. Do not expose this to the internet until it has a certificate.

services:
  postgres:
    image: postgres:16-alpine
    container_name: impulse_postgres
    environment:
      POSTGRES_DB: impulse_analyst
      POSTGRES_USER: impulse
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in a .env file next to docker-compose.yml}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U impulse -d impulse_analyst"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - impulse_network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: impulse_backend
    env_file:
      - ./backend/.env
    # These win over backend/.env.
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+asyncpg://impulse:${POSTGRES_PASSWORD}@postgres:5432/impulse_analyst
      CORS_ORIGINS: http://localhost:${HTTP_PORT:-8080}
      # Only nginx's X-Forwarded-For is believed. Its address is fixed below.
      FORWARDED_ALLOW_IPS: 172.30.57.10
      # Inside the container 127.0.0.1 is the container itself.
      MT5_CONNECTOR_URL: ${MT5_CONNECTOR_URL:-http://host.docker.internal:5001}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data_archive:/app/data_archive
    expose:
      - "8000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - impulse_network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2G

  nginx:
    image: nginx:1.27-alpine
    container_name: impulse_nginx
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "${HTTP_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      impulse_network:
        ipv4_address: 172.30.57.10
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128M

volumes:
  postgres_data:

networks:
  impulse_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.57.0/24
