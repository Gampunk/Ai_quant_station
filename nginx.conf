# The proxy in front of the backend, used by docker-compose.yml.
# It passes the visitor's address in X-Forwarded-For. The backend believes that
# header only from this proxy's address (FORWARDED_ALLOW_IPS).
# No HTTPS yet: that needs a domain and a certificate.

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    server_tokens off;
    client_max_body_size 10M;

    upstream backend {
        server backend:8000;
    }

    server {
        listen 80;
        server_name _;

        add_header X-Frame-Options SAMEORIGIN always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;

        location / {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # AI analysis and backtests can take minutes.
            proxy_read_timeout 300s;
            proxy_connect_timeout 75s;
        }
    }
}
