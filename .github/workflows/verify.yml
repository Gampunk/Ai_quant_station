# Runs the same checks as scripts/verify.sh on every push and pull request.
# It builds the same environments as a developer machine, then runs that script,
# so a green run here and a green run locally mean the same thing.
name: verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - name: Backend environment (Python 3.11, exact pinned versions)
        working-directory: backend
        run: |
          uv venv --python 3.11 .venv
          uv pip install --python .venv/bin/python -r requirements-dev.txt

      - name: Connector environment (Python 3.14, fake MT5)
        working-directory: mt5_connector
        run: |
          uv venv --python 3.14 .venv
          uv pip install --python .venv/bin/python -r requirements-test.txt

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend environment
        working-directory: frontend
        run: npm ci

      - name: Run every check
        run: ./scripts/verify.sh
